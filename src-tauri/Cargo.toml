[package]
name = "flint"
version = "0.1.0"
description = "Flint - a blazing fast launcher for Windows"
authors = ["Flint"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
nucleo-matcher = "0.3"
rayon = "1"
walkdir = "2"
dirs = "5"
parking_lot = "0.12"
png = "0.17"
window-vibrancy = "0.6"
rustc-hash = "2"
webview2-com = "0.39"
pinyin = "0.10"
rfd = "0.15"

[dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
  "Win32_System_Com",
  "Win32_System_Threading",
  "Win32_System_Registry",
  "Win32_Storage_FileSystem",
  "Win32_System_LibraryLoader",
]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
