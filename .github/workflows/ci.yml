name: ci

# The release workflow only runs on tags, which leaves the default branch with
# no status of its own — and a badge has to mean something. This checks every
# push to main and every pull request, using the exact same clippy and build
# command the release does, so a tag never fails for a reason that was knowable
# earlier.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --release --locked -- -D warnings

      - name: Build
        working-directory: src-tauri
        run: cargo build --release --locked
