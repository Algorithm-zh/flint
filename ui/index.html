<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark" data-view="search" data-mode="insert">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Flint</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="frame" id="frame">
    <header class="bar">
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M14.4 2.2 5.6 13.1c-.4.5 0 1.2.6 1.2h3.6l-1.6 7.2c-.1.6.6 1 1 .5l8.9-11c.4-.5 0-1.2-.6-1.2h-3.6l1.5-7.1c.1-.6-.6-1-1-.5Z" fill="currentColor"/>
        </svg>
      </div>
      <input id="q" type="text" spellcheck="false" autocomplete="off" autocorrect="off"
             placeholder="搜索应用、文件或文件夹" />
    </header>

    <main class="list" id="list" role="listbox"></main>

    <footer class="foot">
      <span class="left">
        <span class="mode" id="mode">INSERT</span>
        <span class="meta" id="meta">正在建立索引…</span>
      </span>
      <span class="keys" id="keys">
        <span><kbd>↑</kbd><kbd>↓</kbd>选择</span>
        <span><kbd>↵</kbd>打开</span>
        <span><kbd>⌃</kbd><kbd>↵</kbd>所在位置</span>
        <span><kbd>esc</kbd>收起</span>
      </span>
    </footer>

    <section class="settings" id="settings">
      <header class="set-head">
        <button class="ghost" id="set-back" title="返回搜索">←</button>
        <span class="set-title">设置</span>
        <span class="set-esc">esc 返回</span>
      </header>

      <div class="set-body">
        <section class="grp">
          <h3>索引目录<span>这些目录下的文件会被搜到</span></h3>
          <div class="rows" id="root-rows"></div>
          <button class="add" id="add-root">+ 添加目录</button>
        </section>

        <section class="grp">
          <h3>快捷路径<span>输入关键词直接跳到这个文件夹</span></h3>
          <div class="rows" id="src-rows"></div>
          <button class="add" id="add-src">+ 添加快捷路径</button>
        </section>
      </div>

      <footer class="set-foot">
        <span class="set-msg" id="set-msg"></span>
        <button class="primary" id="set-save">保存并重建索引</button>
      </footer>
    </section>
  </div>
  <script src="app.js"></script>
</body>
</html>
